services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tadbirkor
      POSTGRES_PASSWORD: tadbirkor
      POSTGRES_DB: tadbirkorai
    ports:
      - '5432:5432'
    volumes:
      - tadbirkor_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tadbirkor -d tadbirkorai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tadbirkor_pg:
